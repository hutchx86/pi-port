# Multi-instance / dedicated-IP deployment: a native macvlan network (not the
# default bridge+NAT) so the L2 discovery beacon is visible on the LAN and the
# console reaches each container's :443 directly.
#
# Before use: set `parent` to the real host NIC; give each service a UNIQUE MAC
# and device-id (two sharing either look like one AI Port); pick real free LAN
# addresses. With macvlan the host cannot reach container IPs without an extra
# shim interface. Illustrative -- smoke-test the host-network compose first.
services:
  aiport-main:
    build: .
    image: piport-x86
    container_name: piport-main
    command:
      - "--mac=FCECDA000001"                                # placeholder, unique
      - "--device-id=00000000-0000-4000-8000-000000000001"  # placeholder, unique
      - "--hostname=piport-x86"
    networks:
      lan:
        ipv4_address: 192.0.2.230  # placeholder -- pick a real free LAN address
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

networks:
  lan:
    driver: macvlan
    driver_opts:
      parent: eth0   # <-- replace with the real host NIC connected to the LAN
    ipam:
      config:
        - subnet: 192.0.2.0/24
          gateway: 192.0.2.1
