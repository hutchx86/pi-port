# Single-instance host-network smoke test: the L2 discovery beacon (:10001/udp)
# and control API (:443) land on the real LAN, and run_all.py auto-detects the
# host's route interface. For multiple instances or a distinct IP, use
# docker-compose.macvlan.yml.
#
#   python3 ../../scripts/fetch_models.py
#   docker compose up --build
services:
  aiport:
    build: .
    image: piport-x86
    container_name: piport-x86
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    # The image ships aiport.cfg as a template. For a real console (UNVR)
    # address and identity, mount your own configured copy:
    # volumes:
    #   - ./aiport.cfg:/app/aiport.cfg:ro
